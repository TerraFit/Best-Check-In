name: Build Phase 0 final source
on:
  push:
    branches: [feature/housekeeping-phase0-security-final]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'fix(security): harden employee housekeeping authorization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/housekeeping-phase0-security-final
      - name: Fetch Phase 0 source helpers
        run: git fetch origin feature/housekeeping-phase0-security main
      - name: Apply additive Phase 0 security changes
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          SRC='origin/feature/housekeeping-phase0-security'
          BASE='origin/main'
          def show(ref,p): return subprocess.check_output(['git','show',f'{ref}:{p}'], text=True)
          def write(p,s): Path(p).write_text(s)
          # These files were independently reconstructed on the security branch and are additive/new.
          for p in [
            'netlify/functions/_housekeepingServiceAuth.cjs',
            'docs/migrations/015_employee_password_resets.sql',
            'netlify/functions/employee-password-reset-request.js',
            'netlify/functions/employee-password-reset-confirm.js',
            'netlify/functions/__tests__/phase0-security.test.cjs',
          ]:
            write(p, show(SRC,p))

          # Always start changed production files from main so existing housekeeping logic is retained.
          changed=[
            'netlify/functions/employee-login.js','netlify/functions/generate-housekeeping-tasks.js',
            'netlify/functions/get-housekeeping-tasks.js','netlify/functions/update-housekeeping-task.js',
            'netlify/functions/start-housekeeping-service.js','netlify/functions/update-housekeeping-service-progress.js',
            'netlify/functions/complete-housekeeping-service.js','netlify/functions/get-housekeeping-performance.js',
            'netlify/functions/housekeeping-settings.js','netlify/functions/housekeeping-service-settings.js',
            'netlify/functions/housekeeping-service-targets.js','src/services/housekeepingApi.ts','package.json']
          for p in changed: write(p, show(BASE,p))

          # Employee login: scoped phone lookup; never load the whole employees table.
          p='netlify/functions/employee-login.js'; s=Path(p).read_text()
          if "./_housekeepingServiceAuth.cjs" not in s:
            s=s.replace("const jwt = require('jsonwebtoken');", "const jwt = require('jsonwebtoken');\nconst { phoneDigitVariants } = require('./_housekeepingServiceAuth.cjs');")
          start=s.index("    const allResponse = await fetch(")
          end=s.index("\n    if (!employee) {", start)
          repl="""    const orClause = uniqueVariants.map((v) => `phone_number.eq.${encodeURIComponent(v)}`).join(',');
    const businessId = body.business_id || body.businessId || null;
    const businessFilter = businessId ? `&business_id=eq.${encodeURIComponent(businessId)}` : '';
    const employeesResponse = await fetch(`${supabaseUrl}/rest/v1/employees?select=*&or=(${orClause})${businessFilter}`, {
      headers: {
        apikey: supabaseKey,
        Authorization: `Bearer ${supabaseKey}`,
        'Content-Type': 'application/json',
      },
    });
    if (!employeesResponse.ok) {
      return { statusCode: 500, headers, body: JSON.stringify({ error: 'Database error' }) };
    }
    const candidates = await employeesResponse.json();
    const normalizedCandidates = Array.isArray(candidates) ? candidates : [];
    const exactMatches = normalizedCandidates.filter((emp) => {
      const stored = String(emp.phone_number || '').replace(/\\D/g, '');
      return uniqueVariants.some((variant) => stored === String(variant).replace(/\\D/g, ''));
    });
    if (exactMatches.length !== 1) {
      return { statusCode: 401, headers, body: JSON.stringify({ error: 'Invalid phone number or password' }) };
    }
    let employee = exactMatches[0];
"""
          s=s[:start]+repl+s[end:]
          Path(p).write_text(s)

          # Generate endpoint: fail closed + bind client businessId to JWT scope.
          p='netlify/functions/generate-housekeeping-tasks.js'; s=Path(p).read_text()
          s=s.replace("// Generate focuses on TODAY's operational tasks.", "// Generate focuses on TODAY's operational tasks.\nconst { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');",1)
          marker="  if (event.httpMethod !== 'POST') {\n    return { statusCode: 405, headers, body: JSON.stringify({ error: 'Method Not Allowed' }) };\n  }"
          if "authenticateHousekeepingServiceLive(event, 'generate')" not in s:
            assert marker in s, 'generate method marker missing'
            s=s.replace(marker, marker+"\n\n  const gate = await authenticateHousekeepingServiceLive(event, 'generate');\n  if (!gate.ok) return { statusCode: gate.status || 401, headers, body: JSON.stringify({ error: gate.error, code: gate.code }) };",1)
          old="const { businessId, bookingId, roomId, regenerate = true } = body;"
          new="const { businessId: clientBusinessId, bookingId, roomId, regenerate = true } = body;\n    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;"
          assert old in s, 'generate business destructure missing'
          s=s.replace(old,new,1)
          Path(p).write_text(s)

          # Get endpoint: replace fail-open local auth with shared Live auth and JWT scope.
          p='netlify/functions/get-housekeeping-tasks.js'; s=Path(p).read_text()
          a=s.index('function assertPermission(event, permission) {'); b=s.index('\nfunction isReadyStatus',a)
          s=s[:a]+"const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n\n"+s[b+1:]
          s=s.replace("const gate = assertPermission(event, 'canViewHousekeeping');", "const gate = await authenticateHousekeepingServiceLive(event, 'view');",1)
          s=s.replace("const { businessId, view, date, roomId, status } = q;", "const { businessId: clientBusinessId, view, date, roomId, status } = q;\n    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;",1)
          Path(p).write_text(s)

          # Update endpoint: shared mode-based RBAC + JWT scope.
          p='netlify/functions/update-housekeeping-task.js'; s=Path(p).read_text()
          a=s.index('function assertPermission(event, permission) {'); b=s.index('\nexports.handler =',a)
          s=s[:a]+"const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n\n"+s[b+1:]
          s=s.replace('      businessId,\n      taskId,','      businessId: clientBusinessId,\n      taskId,',1)
          old="    const gate = assertPermission(event, needed);"
          new="    const mode = needed === 'canAssignHousekeepingTasks' ? 'assign' : (needed === 'canStartHousekeepingTask' || needed === 'canCompleteHousekeepingTask' ? 'execute' : (needed === 'canApproveInspection' ? 'manage' : 'view'));\n    const gate = await authenticateHousekeepingServiceLive(event, mode);"
          assert old in s, 'update gate missing'; s=s.replace(old,new,1)
          marker="    const restHeaders = {"
          assert marker in s, 'update rest marker missing'
          s=s.replace(marker,"    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;\n\n"+marker,1)
          Path(p).write_text(s)

          # Service/performance/settings endpoints: only strengthen existing auth to Live; preserve business logic.
          modes={
            'start-housekeeping-service.js':'execute','update-housekeeping-service-progress.js':'execute','complete-housekeeping-service.js':'execute',
            'get-housekeeping-performance.js':'view_performance','housekeeping-settings.js':'manage','housekeeping-service-settings.js':'manage','housekeeping-service-targets.js':'manage'}
          for name,mode in modes.items():
            p='netlify/functions/'+name; s=Path(p).read_text()
            s=s.replace('  authenticateHousekeepingService,','  authenticateHousekeepingServiceLive,')
            s=s.replace('  authenticateHousekeepingService,\n','  authenticateHousekeepingServiceLive,\n')
            s=s.replace('authenticateHousekeepingService(event,',f"authenticateHousekeepingServiceLive(event,",1)
            # If import is destructured on one line, handle that too.
            if 'authenticateHousekeepingServiceLive' not in s:
              s=s.replace('authenticateHousekeepingService,','authenticateHousekeepingServiceLive,')
              s=s.replace('authenticateHousekeepingService(event,', 'authenticateHousekeepingServiceLive(event,',1)
            Path(p).write_text(s)

          # Frontend: Authorization on get/update/generate and clear employee session on live disable.
          p='src/services/housekeepingApi.ts'; s=Path(p).read_text()
          old="""  if (!response.ok) {
    const code = typeof data.code === 'string' ? data.code : '';
    const base ="""
          new="""  if (!response.ok) {
    const code = typeof data.code === 'string' ? data.code : '';
    if (code === 'EMPLOYEE_DISABLED') {
      try { localStorage.removeItem('fastcheckin_employee_auth'); } catch {}
      if (typeof window !== 'undefined' && window.location.pathname !== '/employee/login') window.location.href = '/employee/login';
    }
    const base ="""
          assert old in s, 'housekeepingApi parse marker missing'; s=s.replace(old,new,1)
          # Add auth headers to task fetch/generate/update calls.
          s=s.replace('fetch(`/.netlify/functions/get-housekeeping-tasks?${qs}`)', 'fetch(`/.netlify/functions/get-housekeeping-tasks?${qs}`, { headers: authHeaders() })',1)
          s=s.replace("headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)", "headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(payload)",2)
          Path(p).write_text(s)

          # package script
          p='package.json'; d=json.loads(Path(p).read_text()); d.setdefault('scripts',{})['test:phase0']='node --test netlify/functions/__tests__/phase0-security.test.cjs'; Path(p).write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Verify
        run: |
          npm ci
          npm run test:phase0
          npm run build
          git diff --check
          test "$(git diff --name-only origin/main | wc -l | tr -d ' ')" -eq 18
      - name: Commit source tree and remove workflow
        run: |
          git rm .github/workflows/build-phase0-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/migrations/015_employee_password_resets.sql netlify/functions src/services/housekeepingApi.ts package.json
          git commit -m 'fix(security): harden employee housekeeping authorization'
          git push origin HEAD:feature/housekeeping-phase0-security-final
