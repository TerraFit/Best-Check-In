name: Finalize additive Phase 0
on:
  push:
    branches: [feature/housekeeping-phase0-security-v2]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'fix(security): finalize additive Phase 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 0 security changes without replacing housekeeping logic
        env:
          SOURCE_BRANCH: feature/housekeeping-phase0-security
        run: |
          git fetch origin main "$SOURCE_BRANCH"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = 'origin/' + os.environ['SOURCE_BRANCH']
          def source_file(path): return subprocess.check_output(['git','show',f'{source}:{path}'], text=True)
          for p in ['netlify/functions/_housekeepingServiceAuth.cjs','netlify/functions/employee-login.js','netlify/functions/employee-password-reset-request.js','netlify/functions/employee-password-reset-confirm.js','docs/migrations/015_employee_password_resets.sql','netlify/functions/__tests__/phase0-security.test.cjs']:
              Path(p).write_text(source_file(p))
          p=Path('netlify/functions/generate-housekeeping-tasks.js'); s=p.read_text()
          if "require('./_housekeepingServiceAuth.cjs')" not in s: s="const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n\n"+s
          if "authenticateHousekeepingServiceLive(event, 'generate')" not in s:
              marker="  if (event.httpMethod !== 'POST') {\n    return { statusCode: 405, headers, body: JSON.stringify({ error: 'Method Not Allowed' }) };\n  }\n"
              if marker not in s: raise SystemExit('generate marker not found')
              s=s.replace(marker, marker+"\n  const gate = await authenticateHousekeepingServiceLive(event, 'generate');\n  if (!gate.ok) return { statusCode: gate.status || 401, headers, body: JSON.stringify({ error: gate.error, code: gate.code }) };\n",1)
          old="const { businessId, bookingId, roomId, regenerate = true } = body;"
          if old in s: s=s.replace(old,"const { businessId: clientBusinessId, bookingId, roomId, regenerate = true } = body;\n    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;",1)
          p.write_text(s)
          p=Path('netlify/functions/get-housekeeping-tasks.js'); s=p.read_text(); a=s.find('function assertPermission(event, permission) {'); b=s.find('\nfunction isReadyStatus',a)
          if a<0 or b<0: raise SystemExit('get auth block not found')
          s=s[:a]+"const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n\n"+s[b+1:]
          s=s.replace("const gate = assertPermission(event, 'canViewHousekeeping');","const gate = await authenticateHousekeepingServiceLive(event, 'view');",1)
          s=s.replace("const { businessId, view, date, roomId, status } = q;","const { businessId: clientBusinessId, view, date, roomId, status } = q;\n    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;",1)
          p.write_text(s)
          p=Path('netlify/functions/update-housekeeping-task.js'); s=p.read_text(); a=s.find('function assertPermission(event, permission) {'); b=s.find('\nexports.handler =',a)
          if a<0 or b<0: raise SystemExit('update auth block not found')
          s=s[:a]+"const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n\n"+s[b+1:]
          s=s.replace('businessId,\n      taskId,','businessId: clientBusinessId,\n      taskId,',1)
          s=s.replace("const gate = assertPermission(event, needed);","const mode = needed === 'canAssignHousekeepingTasks' ? 'assign' : (needed === 'canStartHousekeepingTask' || needed === 'canCompleteHousekeepingTask' ? 'execute' : (needed === 'canApproveInspection' ? 'manage' : 'view'));\n    const gate = await authenticateHousekeepingServiceLive(event, mode);",1)
          marker='    const restHeaders = {'
          if marker not in s: raise SystemExit('update marker not found')
          s=s.replace(marker,"    const scope = resolveBusinessId(gate.principal, clientBusinessId);\n    if (!scope.ok) return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    const businessId = scope.businessId;\n\n"+marker,1)
          p.write_text(s)
          for name in ['start-housekeeping-service.js','update-housekeeping-service-progress.js','complete-housekeeping-service.js','get-housekeeping-performance.js','housekeeping-settings.js','housekeeping-service-settings.js','housekeeping-service-targets.js']:
              p=Path('netlify/functions')/name; s=p.read_text(); s=s.replace('  authenticateHousekeepingService,','  authenticateHousekeepingServiceLive,').replace('authenticateHousekeepingService(event,','authenticateHousekeepingServiceLive(event,'); p.write_text(s)
          p=Path('src/services/housekeepingApi.ts'); s=p.read_text()
          if 'EMPLOYEE_DISABLED' not in s:
              old="  if (!response.ok) {\n    const code = typeof data.code === 'string' ? data.code : '';\n    const base ="
              new="  if (!response.ok) {\n    const code = typeof data.code === 'string' ? data.code : '';\n    if (code === 'EMPLOYEE_DISABLED') { try { localStorage.removeItem('fastcheckin_employee_auth'); } catch {} if (typeof window !== 'undefined' && window.location.pathname !== '/employee/login') window.location.href = '/employee/login'; }\n    const base ="
              if old not in s: raise SystemExit('api marker not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('package.json'); d=json.loads(p.read_text()); d.setdefault('scripts',{}).setdefault('test:phase0','node --test netlify/functions/__tests__/phase0-security.test.cjs'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          npm ci
          npm run test:phase0
          npm run build
          git diff --check
          git rm .github/workflows/phase0-finalize-v2.yml
          test "$(git diff --name-only origin/main | wc -l | tr -d ' ')" -eq 18
          git diff --name-only origin/main
          git add docs/migrations/015_employee_password_resets.sql netlify/functions src/services/housekeepingApi.ts package.json
          git commit -m 'fix(security): finalize additive Phase 0'
          git push origin HEAD:feature/housekeeping-phase0-security-v2
