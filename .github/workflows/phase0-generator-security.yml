# Temporary Phase 0 surgical patch; removed automatically after successful patch.
name: Phase 0 generator security patch

on:
  push:
    branches: [feature/housekeeping-phase0-security]

permissions:
  contents: write

jobs:
  patch-generator:
    if: github.event.head_commit.message != 'chore(phase0): remove temporary generator patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/housekeeping-phase0-security
          fetch-depth: 0

      - name: Apply surgical auth gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/generate-housekeeping-tasks.js')
          s = p.read_text()
          marker = "const body = JSON.parse(event.body || '{}');"
          if "authenticateHousekeepingServiceLive" in s:
              print('Auth gate already present')
              raise SystemExit(0)
          gate = """const { authenticateHousekeepingServiceLive, resolveBusinessId } = require('./_housekeepingServiceAuth.cjs');\n    const auth = await authenticateHousekeepingServiceLive(event, 'generate');\n    if (!auth.ok) {\n      return { statusCode: auth.status, headers, body: JSON.stringify({ error: auth.error, code: auth.code }) };\n    }\n\n    const body = JSON.parse(event.body || '{}');"""
          if marker not in s:
              raise SystemExit('Expected generator marker not found')
          s = s.replace(marker, gate, 1)
          marker2 = """if (!businessId) {\n      return {\n        statusCode: 400,\n        headers,\n        body: JSON.stringify({ error: 'businessId required' }),\n      };\n    }"""
          replacement2 = """const scope = resolveBusinessId(auth.principal, businessId);\n    if (!scope.ok) {\n      return { statusCode: scope.status, headers, body: JSON.stringify({ error: scope.error }) };\n    }\n    const scopedBusinessId = scope.businessId;\n\n    if (!businessId && auth.principal.actorType !== 'super_admin') {\n      return { statusCode: 400, headers, body: JSON.stringify({ error: 'businessId required' }) };\n    }"""
          if marker2 not in s:
              raise SystemExit('Expected businessId validation marker not found')
          s = s.replace(marker2, replacement2, 1)
          s = s.replace('${businessId}', '${scopedBusinessId}')
          s = s.replace('business_id: businessId', 'business_id: scopedBusinessId')
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/generate-housekeeping-tasks.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(security): gate housekeeping task generation'
          git push origin HEAD:feature/housekeeping-phase0-security

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/phase0-generator-security.yml
          git commit -m 'chore(phase0): remove temporary generator patch workflow'
          git push origin HEAD:feature/housekeeping-phase0-security
