name: PR85 registration price display fix

on:
  push:
    branches:
      - fix/remove-no-credit-card-required

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[registration-price-display-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show every package price
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/pages/BusinessRegistration.tsx')
          text = path.read_text()
          old = '''                      {!isDisabled ? (\n                        <>\n                          <span className="text-2xl font-bold text-white">\n                            {billingCycle === 'monthly' ? `${currencySymbol}${convertZarToRegionalPrice(displayMonthlyPrice, region, isSouthAfricanMarket, fxRates)}` : `${currencySymbol}${convertZarToRegionalPrice(displayMonthlyPrice, region, isSouthAfricanMarket, fxRates) * 11}`}\n                          </span>\n                          <span className="text-stone-400 text-sm">\n                            {billingCycle === 'monthly' ? t('landing_plan_per_month') : t('landing_plan_per_year')}\n                          </span>\n                        </>\n                      ) : (\n                        <p className="text-sm text-stone-300">{t('reg_plan_requires_rooms', { count: plan.minRooms })}</p>\n                      )}'''
          new = '''                      <>\n                        <span className="text-2xl font-bold text-white">\n                          {billingCycle === 'monthly' ? `${currencySymbol}${convertZarToRegionalPrice(displayMonthlyPrice, region, isSouthAfricanMarket, fxRates)}` : `${currencySymbol}${convertZarToRegionalPrice(displayMonthlyPrice, region, isSouthAfricanMarket, fxRates) * 11}`}\n                        </span>\n                        <span className="text-stone-400 text-sm">\n                          {billingCycle === 'monthly' ? t('landing_plan_per_month') : t('landing_plan_per_year')}\n                        </span>\n                      </>'''
          if old not in text:
              raise SystemExit('price conditional block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BusinessRegistration.tsx
          git diff --cached --quiet || git commit -m "fix: show every registration package price [registration-price-display-fix]"
          git push
