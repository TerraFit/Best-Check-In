          translations.update(waiver)
          locale_files = ['en','af','de','fr','it','pt','es','nl','ru','zh','ar','he']
          for locale in locale_files:
              p = Path(f'src/i18n/translations/{locale}.json')
              data = json.loads(p.read_text(encoding='utf-8'))
              changed = False
              for key, vals in translations.items():
                  if key not in data:
                      data[key] = vals[locale]
                      changed = True
              if changed:
