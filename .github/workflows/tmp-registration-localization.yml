name: Temporary Registration Localization

on:
  push:
    branches:
      - fix/remove-no-credit-card-required

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply registration localization
        env:
          TARGET_BRANCH: fix/remove-no-credit-card-required
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          component = Path('src/pages/BusinessRegistration.tsx')
          s = component.read_text(encoding='utf-8')

          replacements = {
            "alert('File must be less than 2MB');": "alert(t('reg_file_too_large'));",
            "alert(data.error || 'Registration failed. Please try again.');": "alert(data.error || t('reg_registration_failed'));",
            "alert(`${regionLabel} is required`);": "alert(t('reg_region_required', { region: t(`reg_region_${regionLabel.toLowerCase()}`) }));",
            "`${currencySymbol}${convertZarToRegionalPrice(selectedPlan?.priceMonthly || 0, region, isSouthAfricanMarket, fxRates)}/month`": "`${currencySymbol}${convertZarToRegionalPrice(selectedPlan?.priceMonthly || 0, region, isSouthAfricanMarket, fxRates)}${t('landing_plan_per_month')}`",
            "`${currencySymbol}${convertZarToRegionalPrice(selectedPlan?.priceMonthly || 0, region, isSouthAfricanMarket, fxRates) * 11}/year`": "`${currencySymbol}${convertZarToRegionalPrice(selectedPlan?.priceMonthly || 0, region, isSouthAfricanMarket, fxRates) * 11}${t('landing_plan_per_year')}`",
            "{(plan.id === 'starter' || plan.id === 'growth') && <p className=\"text-xs text-stone-400 mt-1\">{t('landing_pf_marketing_download')}: {currencySymbol}{marketingDownloadMonthlyPrice}{t('landing_plan_per_month')} or {currencySymbol}{marketingDownloadVoucherPrice} voucher</p>}": "{(plan.id === 'starter' || plan.id === 'growth') && <p className=\"text-xs text-stone-400 mt-1\">{t('landing_pf_marketing_download')}: {currencySymbol}{marketingDownloadMonthlyPrice}{t('landing_plan_per_month')} {t('reg_or')} {currencySymbol}{marketingDownloadVoucherPrice} {t('reg_voucher')}</p>}",
            "21+ rooms across your portfolio · first 2 properties included": "{t('reg_enterprise_capacity')}",
            "`Includes ${propertyCount - 2} additional propert${propertyCount - 2 === 1 ? 'y' : 'ies'}`": "t('reg_enterprise_additional_properties', { count: propertyCount - 2 })",
            "'Includes up to 2 properties'": "t('reg_enterprise_up_to_two')",
            "'/' + billingCycle": "'/' + billingCycle",
            ">\n                    /{billingCycle === 'monthly' ? 'month' : 'year'}\n                  </span>": ">\n                    {billingCycle === 'monthly' ? t('landing_plan_per_month') : t('landing_plan_per_year')}\n                  </span>",
            "Coming Soon · Notify Me": "{t('reg_coming_soon_notify')}",
            "Regional display price only. Enterprise is not yet available for online purchase; Peach Payments billing will be in ZAR.": "{t('reg_enterprise_regional_note')}",
            ">City / Town</label>": ">{t('reg_city_town')}</label>",
            ">Country</label>": ">{t('reg_country')}</label>",
            ">Postal Code</label>": ">{t('reg_postal_code')}</label>",
            ">Website URL</label>": ">{t('reg_website_url')}</label>",
            "placeholder=\"https://example.com\"": "placeholder={t('reg_website_placeholder')}",
            ">Next →</button>": ">{t('reg_next')} →</button>",
            "Upload ID / Passport Photo *": "{t('reg_upload_id_photo')} *",
            "alt=\"ID Preview\"": "alt={t('reg_id_preview')}",
            ">Address</h3>": ">{t('reg_address')}</h3>",
            ">← Back</button>": ">{t('reg_back')} </button>",
            "<h3 className=\"text-lg font-bold text-white mb-4\">FastCheckin Platform Waiver</h3>": "<h3 className=\"text-lg font-bold text-white mb-4\">{t('reg_waiver_title')}</h3>",
            "<p><strong>1. Acceptance of Terms</strong><br />By using the FastCheckin platform, you agree to be bound by these terms and conditions.</p>": "<p><strong>{t('reg_waiver_1_title')}</strong><br />{t('reg_waiver_1_text')}</p>",
            "<p><strong>2. Platform Usage</strong><br />FastCheckin provides a digital check-in solution for accommodations. The platform is provided \"as is\" without warranties.</p>": "<p><strong>{t('reg_waiver_2_title')}</strong><br />{t('reg_waiver_2_text')}</p>",
            "<p><strong>3. Limitation of Liability</strong><br />To the maximum extent permitted by law, FastCheckin shall not be liable for any indirect, incidental, special, consequential, or punitive damages.</p>": "<p><strong>{t('reg_waiver_3_title')}</strong><br />{t('reg_waiver_3_text')}</p>",
            "<p><strong>4. Data Processing</strong><br />You acknowledge that guest data is processed in accordance with POPIA and our Privacy Policy.</p>": "<p><strong>{t('reg_waiver_4_title')}</strong><br />{t('reg_waiver_4_text')}</p>",
            "<p><strong>5. Indemnification</strong><br />You agree to indemnify and hold FastCheckin harmless from any claims arising from your use of the platform.</p>": "<p><strong>{t('reg_waiver_5_title')}</strong><br />{t('reg_waiver_5_text')}</p>",
            "<p><strong>6. Termination</strong><br />FastCheckin reserves the right to suspend or terminate access for violation of these terms.</p>": "<p><strong>{t('reg_waiver_6_title')}</strong><br />{t('reg_waiver_6_text')}</p>",
            "<p><strong>7. Governing Law</strong><br />This agreement shall be governed by the laws of the Republic of South Africa.</p>": "<p><strong>{t('reg_waiver_7_title')}</strong><br />{t('reg_waiver_7_text')}</p>",
            "I have read, understood, and agree to the terms of this waiver and the FastCheckin platform agreement.": "{t('reg_waiver_accept')}",
            "<p>Business: <span className=\"text-white\">{businessData.tradingName}</span></p>": "<p>{t('reg_summary_business')}: <span className=\"text-white\">{businessData.tradingName}</span></p>",
            "<p>Legal Name: <span className=\"text-white\">{businessData.legalName}</span></p>": "<p>{t('reg_summary_legal_name')}: <span className=\"text-white\">{businessData.legalName}</span></p>",
            "<p>Type: <span className=\"text-white\">{businessData.establishmentType || 'Not specified'}</span></p>": "<p>{t('reg_summary_type')}: <span className=\"text-white\">{businessData.establishmentType || t('reg_not_specified')}</span></p>",
            "<p>TGSA: <span className=\"text-white\">{businessData.tgsaGrading}</span></p>": "<p>{t('reg_summary_tgsa')}: <span className=\"text-white\">{businessData.tgsaGrading}</span></p>",
            "<p>Plan: <span className=\"text-white\">{selectedPlanId === 'enterprise' ? 'Enterprise' : selectedPlan?.name}</span></p>": "<p>{t('reg_summary_plan')}: <span className=\"text-white\">{selectedPlanId === 'enterprise' ? 'Enterprise' : selectedPlan?.name}</span></p>",
            "<p>Properties: <span className=\"text-white\">{propertyCount}</span></p>": "<p>{t('reg_summary_properties')}: <span className=\"text-white\">{propertyCount}</span></p>",
            "<p>Total rooms: <span className=\"text-white\">{roomsCount}</span></p>": "<p>{t('reg_summary_total_rooms')}: <span className=\"text-white\">{roomsCount}</span></p>",
            "<p>Director: <span className=\"text-white\">{directorData.name} {directorData.surname}</span></p>": "<p>{t('reg_summary_director')}: <span className=\"text-white\">{directorData.name} {directorData.surname}</span></p>",
            "<p>Email: <span className=\"text-white\">{businessData.email}</span></p>": "<p>{t('reg_summary_email')}: <span className=\"text-white\">{businessData.email}</span></p>",
            "<p>Phone: <span className=\"text-white\">{businessData.mobilePhone}</span></p>": "<p>{t('reg_summary_phone')}: <span className=\"text-white\">{businessData.mobilePhone}</span></p>",
          }
          for old, new in replacements.items():
              if old not in s:
                  print('MISSING:', old[:100])
              s = s.replace(old, new)

          # Dynamic region selectors/placeholders.
          s = s.replace('Select {getRegionLabel(businessData.physicalCountry)}', "{t('reg_select')} {t(`reg_region_${getRegionLabel(businessData.physicalCountry).toLowerCase()}`)}")
          s = s.replace('placeholder={`Enter ${getRegionLabel(businessData.physicalCountry).toLowerCase()}`}', "placeholder={`${t('reg_enter')} ${t(`reg_region_${getRegionLabel(businessData.physicalCountry).toLowerCase()}`)}`}")
          s = s.replace('Select {getRegionLabel(businessData.postalCountry)}', "{t('reg_select')} {t(`reg_region_${getRegionLabel(businessData.postalCountry).toLowerCase()}`)}")
          s = s.replace('placeholder={`Enter ${getRegionLabel(businessData.postalCountry).toLowerCase()}`}', "placeholder={`${t('reg_enter')} ${t(`reg_region_${getRegionLabel(businessData.postalCountry).toLowerCase()}`)}`}")
          s = s.replace("const regionLabel = getRegionLabel(businessData.physicalCountry);", "const regionLabel = getRegionLabel(businessData.physicalCountry);")

          component.write_text(s, encoding='utf-8')

          translations = {
            'reg_file_too_large': {
