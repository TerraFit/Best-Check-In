      - name: Validate and commit
        run: |
          node -e "const fs=require('fs'); for (const f of fs.readdirSync('src/i18n/translations')) { if (f.endsWith('.json')) JSON.parse(fs.readFileSync('src/i18n/translations/'+f,'utf8')); }"
          grep -n "getRecommendedPlanId" src/pages/BusinessRegistration.tsx
          if grep -n "get{t(" src/pages/BusinessRegistration.tsx; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BusinessRegistration.tsx src/i18n/translations .github/workflows/tmp-registration-localization.yml
          git commit -m "fix: complete business registration localization"
