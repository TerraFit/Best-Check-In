name: Sync analytics branch with main

on:
  push:
    branches:
      - feature/analytics-intelligence

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analytics branch
        uses: actions/checkout@v4
        with:
          ref: feature/analytics-intelligence
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge current main into analytics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main -m "chore: sync analytics branch with main"
          git push origin HEAD:feature/analytics-intelligence
