name: Fix brochure translation syntax

on:
  push:
    branches:
      - feature/dynamic-repository-brochure

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: repair brochure translation commas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-repository-brochure
          fetch-depth: 0
      - name: Repair missing commas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/i18n/brochureTranslations.ts')
          s = p.read_text(encoding='utf-8')
          old = "'Daily operations': '"
          lines = s.splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if old in line and not line.rstrip().endswith(','):
                  lines[i] = line.rstrip() + ','
                  changed += 1
          if changed != 11:
              raise SystemExit(f'Expected to repair 11 locale entries, repaired {changed}')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/brochureTranslations.ts .github/workflows/fix-brochure-translation-syntax.yml
          git rm .github/workflows/fix-brochure-translation-syntax.yml
          git commit -m "fix: repair brochure translation commas"
          git push origin HEAD:feature/dynamic-repository-brochure
