name: Housekeeping regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify/functions/**'
      - 'src/components/housekeeping/**'
      - 'src/pages/tabs/HousekeepingTab.tsx'
      - 'src/services/housekeepingApi.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - feature/admin-bulk-room-readiness-main-base

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run housekeeping regression tests
        run: npm run test:housekeeping
      - name: Build production bundle
        run: npm run build
